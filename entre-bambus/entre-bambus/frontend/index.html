<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Caderno · Entre Bambus</title>
  <link rel="stylesheet" href="caderno.css">
  <script src="trilhas.js" defer></script>
</head>
<body>
  <header><nav class="wrap" aria-label="Navegação principal">
    <a class="brand" href="./"><span class="mark" aria-hidden="true">❧</span> Entre Bambus</a>
    <a href="./#acervo">Caderno</a><a class="btn" href="criar.html">Escrever nota</a>
  </nav></header>
  <main class="wrap">
    <section class="hero"><div><p class="kicker">Notas da floresta</p><h1>Por entre os bambus</h1><p>Um caderno sobre a vida dos pandas e as florestas que eles habitam.</p></div><img src="capa.png" alt="Panda entre bambus em uma floresta de montanha"></section>
    <section id="acervo" class="collection">
      <aside><h2>Caderno de campo</h2><form class="filters" id="filtros">
        <label>Pesquisar<input name="q" type="search" placeholder="Ex.: bambu"></label>
        <label>Categoria<select name="categoria"><option value="">Todas</option><option>Alimentação</option><option>Habitat</option><option>Espécies</option><option>Conservação</option></select></label>
        <button>Buscar</button>
      </form></aside>
      <div><p class="message" role="status" id="aviso">Buscando publicações…</p>
        <div id="lista"></div>
      </div>
    </section>
  </main>
  <footer><div class="wrap">Entre Bambus · Alice Brombatti</div></footer>
</body>
</html>
