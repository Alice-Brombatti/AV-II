<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Escrever nota · Entre Bambus</title>
  <link rel="stylesheet" href="caderno.css">
  <script src="trilhas.js" defer></script>
</head>
<body>
  <header><nav class="wrap" aria-label="Navegação principal">
    <a class="brand" href="./"><span class="mark" aria-hidden="true">❧</span> Entre Bambus</a>
    <a href="./#acervo">Caderno</a><a class="btn" href="criar.html">Escrever nota</a>
  </nav></header>
  <main class="wrap">
    <section class="editor">
      <p class="kicker">Caderno da Alice</p>
      <h1>Escrever nota</h1>
      <form id="editor">
        <label>Título<input name="titulo" required maxlength="200"></label>
        <label>Categoria<select name="categoria" required><option value="">Escolha uma categoria</option><option>Alimentação</option><option>Habitat</option><option>Espécies</option><option>Conservação</option></select></label>
        <label>Resumo (opcional)<textarea name="descricao" rows="2" maxlength="300"></textarea></label>
        <label>Texto completo<textarea name="conteudo" required rows="8"></textarea></label>
        <label>Senha de edição<input name="senha" type="password" required autocomplete="current-password"></label>
        <button type="submit">Publicar nota</button>
      </form>
      <p id="aviso" role="status"></p>
    </section>
  </main>
  <footer><div class="wrap">Entre Bambus · Alice Brombatti</div></footer>
</body>
</html>
